site_name: 5CTA0 · pass the exam
site_description: Active study guide and cheat sheet for 5CTA0 Statistical Signal Processing (TU/e), built from every past exam.
site_url: https://dkealvaro.github.io/5cta0-study-guide/
use_directory_urls: false
repo_url: https://github.com/DKeAlvaro/5cta0-study-guide
repo_name: DKeAlvaro/5cta0-study-guide

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Source Serif 4
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    logo: material/book-open-variant
    repo: fontawesome/brands/github
  features:
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - content.tooltips

plugins: []

# Top-level sections starting with "New" / "Old" get the collapsible behaviour of navsections.js.
nav:
  - Start here: index.md
  - Every exam question + ranking: inventory.md
  - M · Maths the course assumes: maths.md
  - Part 4 · Detection:
      - U16 · Likelihood ratio test: u16-lrt.md
      - U17 · P_FA, P_D, P_M: u17-pfa-pd.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr
  - toc:
      permalink: "#"
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.smartsymbols:
      copyright: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/quiz.js
  - javascripts/ask.js
  - javascripts/video.js
  - javascripts/layout.js
  - javascripts/keypoints.js
  - javascripts/progress.js
  - javascripts/widgets.js
  - javascripts/navsections.js
extra_css:
  - https://unpkg.com/katex@0.16.11/dist/katex.min.css
  - https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap
  - stylesheets/extra.css
  - stylesheets/ask.css
  - stylesheets/layout.css
  - stylesheets/keypoints.css
  - stylesheets/widgets.css

extra:
  generator: false

hooks:
  - hooks/cachebust.py
